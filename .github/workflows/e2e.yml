name: PIXEL TOWN verification

concurrency:
  group: pixel-town-verification-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload UI screenshots and Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-town-ui-screenshots
          path: |
            test-results/screenshots/
            test-results/playwright/
            test-results/server.log
            test-results/server-errors.log
          if-no-files-found: ignore
          retention-days: 7
