<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>픽셀 경제 마을 3D</title>
<script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4ff;font-family:system-ui,sans-serif;overflow:hidden}button,input{font:inherit;border:0;border-radius:9px;padding:9px}button{background:#347fba;color:white;font-weight:700;cursor:pointer}header{height:auto;min-height:54px;padding:8px 12px;background:#182a42;display:flex;align-items:center;gap:8px;justify-content:space-between;position:relative;z-index:5;flex-wrap:wrap}h1{font-size:17px;margin:0}.menus{display:flex;gap:5px;flex-wrap:wrap}.menus button{font-size:13px;padding:8px}#connection{font-size:12px;color:#a9d7ff}#login{max-width:520px;margin:7vh auto;background:#1b2b43;padding:20px;border-radius:14px}#login .row{display:flex;gap:7px;flex-wrap:wrap}#login input{min-width:0;flex:1}#gameArea{display:none}#hud{position:absolute;z-index:3;top:67px;left:10px;background:#14243bdc;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.7;pointer-events:none}#game{height:calc(100dvh - 58px);width:100%;touch-action:none}#game canvas{display:block;width:100%;height:100%}.panel{background:#1b2b43;border:1px solid #38516e;border-radius:12px;padding:12px;margin:8px}#menuPanel{display:none;position:absolute;z-index:6;top:65px;right:10px;width:min(390px,calc(100vw - 20px));max-height:65vh;overflow:auto;box-shadow:0 8px 30px #0008}#menuPanel h3{margin:0 0 9px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row button{font-size:13px}.small{font-size:12px;color:#b9c8dc}#notice{min-height:20px;color:#ffdf82}#teacher{display:none;position:absolute;z-index:7;inset:70px 10px auto;max-height:70vh;overflow:auto}#teacher .tile{background:#263c58;padding:7px;margin:5px;border-radius:7px}#touchPad{position:absolute;z-index:4;bottom:20px;left:18px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;touch-action:none}#touchPad button{padding:0;font-size:20px;background:#183653d9;border:1px solid #ffffff55}#jump{position:absolute;z-index:4;right:22px;bottom:35px;width:76px;height:76px;border-radius:50%;background:#d18b36e8;font-size:16px;border:2px solid #fff8}#touchPad .empty{visibility:hidden}.hidden{display:none!important}@media(min-width:850px){#touchPad,#jump{opacity:.72}}
</style></head><body>
<header><h1>🧊 픽셀 경제 마을</h1><nav class="menus"><button onclick="openMenu('inventory')">🎒 가방</button><button onclick="openMenu('shop')">🛒 상점</button><button onclick="openMenu('bank')">🏦 은행</button><button onclick="openMenu('stocks')">📈 주식</button><button onclick="openMenu('land')">🏠 부동산</button><button onclick="openMenu('settings')">⚙️ 설정</button></nav><span id="connection">서버 연결 중</span></header>
<section id="login"><h2>🏘️ 교실 입장</h2><div class="row"><input id="name" maxlength="12" placeholder="이름 또는 별명"><input id="room" value="TOWN123" style="max-width:120px" placeholder="방 코드"><button onclick="join()">입장</button></div><p class="small">선생님이 알려준 방 코드를 입력하세요. 최대 30명.</p><hr><h3>👩‍🏫 교사용</h3><div class="row"><input id="pin" type="password" placeholder="교사 PIN"><button onclick="teacherLogin()">관리자 화면</button></div></section>
<section id="gameArea"><div id="hud"><b id="cash">현금 500원</b><br><span id="bank">예금 0원</span> · <span id="job">무직</span><br><span id="count">접속 0/30</span></div><div id="game"></div>
<div id="touchPad"><span class="empty"></span><button data-dir="forward">▲</button><span class="empty"></span><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div><button id="jump" onpointerdown="jumpStart()" onpointerup="jumpEnd()" onpointerleave="jumpEnd()">점프</button>
<div id="menuPanel" class="panel"><div class="row" style="justify-content:space-between"><h3 id="menuTitle">메뉴</h3><button onclick="closeMenu()">닫기 ✕</button></div><div id="menuContent"></div></div>
<div id="notice" style="position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);background:#14243bdc;padding:6px 12px;border-radius:8px;text-align:center"></div>
<section id="teacher" class="panel"><div class="row" style="justify-content:space-between"><h2>👩‍🏫 선생님 관리자</h2><button onclick="document.getElementById('teacher').style.display='none'">닫기</button></div><p id="teacherCount"></p><div class="row"><input id="teacherNews" placeholder="경제 뉴스 입력"><button onclick="teacherCmd('news',document.getElementById('teacherNews').value)">뉴스 공지</button><input id="bonus" type="number" value="100" style="width:80px"><button onclick="teacherCmd('bonus',document.getElementById('bonus').value)">전체 보너스</button><input id="tax" type="number" value="5" style="width:65px"><button onclick="teacherCmd('tax',Number(document.getElementById('tax').value)/100)">세율 설정(%)</button></div><div id="roster"></div></section>
</section>
<script>
const socket=io();let myId=null,teacherPin='',teacher=false,players=[],scene,renderer,camera,world,me,remote=new Map(),keys={},jumping=false,vy=0,lastSend=0,lastX=0,lastZ=0,lastJump=false,menu='inventory';
const $=id=>document.getElementById(id);
function join(){socket.emit('join',{name:$('name').value,room:$('room').value})}
function teacherLogin(){teacherPin=$('pin').value;socket.emit('teacherLogin',teacherPin)}
function act(type,item='',amount=1){socket.emit('action',{type,item,amount})}
function teacherCmd(type,value){socket.emit('teacherCommand',{pin:teacherPin,type,value})}
socket.on('connect',()=>$('connection').textContent='서버 연결됨');socket.on('disconnect',()=>$('connection').textContent='연결 끊김');
socket.on('joined',d=>{myId=d.id;$('login').style.display='none';$('gameArea').style.display='block';init3D()});
socket.on('teacherOK',s=>{teacher=true;$('login').style.display='none';$('gameArea').style.display='block';$('teacher').style.display='block';render(s)});
socket.on('notice',m=>$('notice').textContent=m);socket.on('state',render);
function makeBlock(w,h,d,color,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));o.position.set(x,y,z);world.add(o);return o}
function makePlayer(id,name,color){const g=new THREE.Group();const mat=new THREE.MeshLambertMaterial({color});const skin=new THREE.MeshLambertMaterial({color:0xf0c59a});const body=new THREE.Mesh(new THREE.BoxGeometry(.72,.85,.38),mat);body.position.y=1.05;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62),skin);head.position.y=1.82;g.add(head);const legs=[];for(let x of [-.2,.2]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.65,.28),new THREE.MeshLambertMaterial({color:0x26364e}));leg.position.set(x,.33,0);g.add(leg);legs.push(leg)}const cv=document.createElement('canvas');cv.width=256;cv.height=64;const ctx=cv.getContext('2d');ctx.fillStyle='#102030';ctx.fillRect(0,0,256,64);ctx.fillStyle='white';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(name.slice(0,12),128,44);const tex=new THREE.CanvasTexture(cv);const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));label.scale.set(2.4,.6,1);label.position.y=2.55;g.add(label);g.userData.legs=legs;g.userData.label=label;return g}
function init3D(){const host=$('game');scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9ed);scene.fog=new THREE.Fog(0x91c9ed,35,95);camera=new THREE.PerspectiveCamera(65,host.clientWidth/host.clientHeight,.1,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);world=new THREE.Group();scene.add(world);scene.add(new THREE.HemisphereLight(0xffffff,0x64805a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-15,30,15);sun.castShadow=true;scene.add(sun);
makeBlock(100,.5,100,0x68b96b,0,-.3,0);makeBlock(10,.08,100,0xaaa99a,0,.01,0);makeBlock(100,.08,10,0xaaa99a,0,.02,0);
function building(x,z,w,d,h,wall,roof){makeBlock(w,h,d,wall,x,h/2,z);makeBlock(w+0.5,.45,d+0.5,roof,x,h+.2,z);makeBlock(.9,1.6,.15,0x65432c,x,0.8,z-d/2-.08)}
building(-13,-12,9,8,6,0xe6b65c,0x9d483d);building(0,-16,10,9,8,0x8ab5d7,0x3e6592);building(14,-11,9,8,6,0xd28f8f,0x874b50);building(-14,13,10,8,5,0xa997d5,0x66528f);building(13,13,10,8,7,0xd2c59d,0x5c8050);
for(let i=-4;i<=4;i++){makeBlock(.3,.04,1.2,0x477f47,i*5,.02,6);makeBlock(1.2,.04,.3,0x477f47,6,.02,i*5)}
for(let i=0;i<22;i++){const x=(Math.random()-.5)*85,z=(Math.random()-.5)*85;if(Math.abs(x)<22&&Math.abs(z)<22)continue;makeBlock(.7,2,.7,0x79502f,x,1,z);const crown=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.8,2.6),new THREE.MeshLambertMaterial({color:0x368b48}));crown.position.set(x,3.1,z);world.add(crown)}
me=makePlayer(myId,$('name').value||'나',0xf0c64b);scene.add(me);me.position.set(0,0,0);
window.addEventListener('resize',resize3D);requestAnimationFrame(loop)}
function resize3D(){if(!renderer)return;const h=$('game');camera.aspect=h.clientWidth/h.clientHeight;camera.updateProjectionMatrix();renderer.setSize(h.clientWidth,h.clientHeight)}
function render(s){if(!s)return;players=s.players||[];const p=players.find(v=>v.id===myId);if(p){$('cash').textContent='현금 '+p.money+'원';$('bank').textContent='예금 '+p.bank+'원';$('job').textContent='직업: '+p.job;$('inventoryText')?.replaceChildren(document.createTextNode(''))} $('count').textContent='접속 '+players.length+'/30';if(teacher){$('teacherCount').textContent='현재 '+players.length+'/30명 접속 · 세율 '+Math.round(s.taxRate*100)+'%';$('roster').innerHTML='<h3>학생 현황</h3>'+players.map(p=>'<div class="tile">'+esc(p.name)+' · 현금 '+p.money+'원 · 예금 '+p.bank+'원 · '+esc(p.job)+'</div>').join('')}if(scene){const ids=new Set(players.filter(p=>p.id!==myId).map(p=>p.id));for(const [id,obj] of remote){if(!ids.has(id)){scene.remove(obj);remote.delete(id)}}players.filter(p=>p.id!==myId).forEach(p=>{let obj=remote.get(p.id);if(!obj){obj=makePlayer(p.id,p.name,0x5599ed);scene.add(obj);remote.set(p.id,obj)}obj.position.set(p.x||0,p.jump?.45:0,p.z||0)})}if(p)updateMenuData(p,s)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loop(t){requestAnimationFrame(loop);if(!scene)return;const forward=(keys.forward?1:0)-(keys.back?1:0),side=(keys.right?1:0)-(keys.left?1:0);let moving=forward!==0||side!==0;if(moving){const len=Math.hypot(forward,side);const f=forward/len,sd=side/len;me.position.x+=sd*.12;me.position.z-=f*.12;me.position.x=Math.max(-46,Math.min(46,me.position.x));me.position.z=Math.max(-46,Math.min(46,me.position.z));me.rotation.y=Math.atan2(sd,f)}if(jumping){vy-=.018;me.position.y+=vy;if(me.position.y<=0){me.position.y=0;vy=0;jumping=false}}if(moving){const phase=t*.014;me.userData.legs[0].rotation.x=Math.sin(phase)*.7;me.userData.legs[1].rotation.x=-Math.sin(phase)*.7}else{me.userData.legs.forEach(l=>l.rotation.x=0)}
const target=new THREE.Vector3(me.position.x,me.position.y+2,me.position.z);const behind=new THREE.Vector3(me.position.x,me.position.y+6,me.position.z+9);camera.position.lerp(behind,.12);camera.lookAt(target);
if(t-lastSend>100&&(Math.abs(me.position.x-lastX)>.04||Math.abs(me.position.z-lastZ)>.04||moving||jumping!==lastJump)){socket.emit('move3d',{x:me.position.x,z:me.position.z,jump:jumping});lastX=me.position.x;lastZ=me.position.z;lastJump=jumping;lastSend=t}
remote.forEach(obj=>{if(obj.userData.legs)obj.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*.01+i*Math.PI)*.12)});renderer.render(scene,camera)}
function jumpStart(){if(!jumping&&me){jumping=true;vy=.27;socket.emit('move3d',{x:me.position.x,z:me.position.z,jump:true})}}function jumpEnd(){}
function setKey(k,on){keys[k]=on}window.addEventListener('keydown',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.code==='Space'){jumpStart();e.preventDefault()}});window.addEventListener('keyup',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(map[e.key])keys[map[e.key]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function openMenu(m){menu=m;$('menuPanel').style.display='block';drawMenu()}function closeMenu(){$('menuPanel').style.display='none'}
function drawMenu(){const titles={inventory:'🎒 내 가방',shop:'🛒 마을 상점',bank:'🏦 은행',stocks:'📈 주식 시장',land:'🏠 부동산',settings:'⚙️ 설정'};$('menuTitle').textContent=titles[menu];let c='';if(menu==='inventory')c='<p id="inventoryText">보유 물품은 접속 후 표시됩니다.</p>';if(menu==='shop')c='<p>사과 10원 · 빵 20원 · 장난감 35원</p><div class="row"><button onclick="act(\'buy\',\'apple\',1)">사과 구매</button><button onclick="act(\'buy\',\'bread\',1)">빵 구매</button><button onclick="act(\'buy\',\'toy\',1)">장난감 구매</button><button onclick="act(\'sell\',\'apple\',1)">사과 판매</button></div><button onclick="act(\'work\')">일하기 +100원</button>';if(menu==='bank')c='<p>100원 단위로 저축/출금할 수 있어요.</p><button onclick="act(\'deposit\',\'\',1)">100원 예금</button> <button onclick="act(\'withdraw\',\'\',1)">100원 출금</button>';if(menu==='stocks')c='<p>하늘항공 50원 · 픽셀상사 35원</p><button onclick="act(\'stockBuy\',\'SKY\',1)">하늘항공 1주 구매</button> <button onclick="act(\'stockSell\',\'SKY\',1)">하늘항공 1주 판매</button><br><button onclick="act(\'stockBuy\',\'PIX\',1)">픽셀상사 1주 구매</button> <button onclick="act(\'stockSell\',\'PIX\',1)">픽셀상사 1주 판매</button>';if(menu==='land')c='<p>작은 집 500원 · 상점 건물 900원 · 강변 집 1,200원</p><button onclick="act(\'property\',\'house1\')">작은 집 구매</button> <button onclick="act(\'property\',\'shop1\')">상점 구매</button> <button onclick="act(\'property\',\'house2\')">강변 집 구매</button>';if(menu==='settings')c='<p>조작: WASD 또는 방향키로 이동, 스페이스/점프 버튼으로 점프.</p><p>태블릿은 화면 왼쪽 방향키를 사용하세요.</p><button onclick="closeMenu()">게임으로 돌아가기</button>'; $('menuContent').innerHTML=c}
function updateMenuData(p,s){if(menu==='inventory'&&$('menuPanel').style.display==='block'){$('menuContent').innerHTML='<p>사과 '+p.inventory.apple+'개 · 빵 '+p.inventory.bread+'개 · 장난감 '+p.inventory.toy+'개</p><p>하늘항공 '+p.shares.SKY+'주 · 픽셀상사 '+p.shares.PIX+'주</p><p>보유 부동산: '+(p.property.length?p.property.join(', '):'없음')+'</p>'}}
</script></body></html>
