<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>픽셀 경제 마을 3D</title>
<script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4ff;font-family:system-ui,sans-serif;overflow:hidden}button,input{font:inherit;border:0;border-radius:9px;padding:9px}button{background:#347fba;color:white;font-weight:700;cursor:pointer}header{height:auto;min-height:54px;padding:8px 12px;background:#182a42;display:flex;align-items:center;gap:8px;justify-content:space-between;position:relative;z-index:5;flex-wrap:wrap}h1{font-size:17px;margin:0}.menus{display:flex;gap:5px;flex-wrap:wrap}.menus button{font-size:13px;padding:8px}#connection{font-size:12px;color:#a9d7ff}#login{max-width:520px;margin:7vh auto;background:#1b2b43;padding:20px;border-radius:14px}#login .row{display:flex;gap:7px;flex-wrap:wrap}#login input{min-width:0;flex:1}#gameArea{display:none}#hud{position:absolute;z-index:3;top:67px;left:10px;background:#14243bdc;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.7;pointer-events:none}#game{height:calc(100dvh - 58px);width:100%;touch-action:none}#game canvas{display:block;width:100%;height:100%}.panel{background:#1b2b43;border:1px solid #38516e;border-radius:12px;padding:12px;margin:8px}#menuPanel{display:none;position:absolute;z-index:6;top:65px;right:10px;width:min(390px,calc(100vw - 20px));max-height:65vh;overflow:auto;box-shadow:0 8px 30px #0008}#menuPanel h3{margin:0 0 9px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row button{font-size:13px}.small{font-size:12px;color:#b9c8dc}#stockChart{width:100%;height:180px;background:#102033;border-radius:8px}#menuContent input{max-width:100%}#notice{min-height:20px;color:#ffdf82}#teacher{display:none;position:absolute;z-index:7;inset:70px 10px auto;max-height:70vh;overflow:auto}#teacher .tile{background:#263c58;padding:7px;margin:5px;border-radius:7px}#lobbyOverlay{position:absolute;z-index:5;left:50%;top:48%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 36px));padding:20px;background:#10243eef;border:1px solid #8bbbe8;border-radius:16px;text-align:center;box-shadow:0 12px 40px #0008}#lobbyOverlay h2{margin:0 0 8px}#lobbyOverlay p{margin:5px 0;color:#d5e7fa}#touchPad{position:absolute;z-index:4;bottom:20px;left:18px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;touch-action:none}#touchPad button{padding:0;font-size:20px;background:#183653d9;border:1px solid #ffffff55}#jump{position:absolute;z-index:4;right:22px;bottom:35px;width:76px;height:76px;border-radius:50%;background:#d18b36e8;font-size:16px;border:2px solid #fff8}#touchPad .empty{visibility:hidden}.hidden{display:none!important}@media(min-width:850px){#touchPad,#jump{opacity:.72}}

/* polished town UI */
body{background:radial-gradient(ellipse at top,#203b59 0%,#101827 65%)}header{background:linear-gradient(110deg,#14263d,#203b59);border-bottom:1px solid #42617f;box-shadow:0 5px 20px #0005}header h1{letter-spacing:.2px}.menus button,.refreshBtn{background:linear-gradient(180deg,#448fc8,#28618f);border:1px solid #78b8e8;box-shadow:0 3px 0 #17456a;transition:transform .12s,filter .12s,box-shadow .12s}.menus button:hover,.refreshBtn:hover{filter:brightness(1.15);transform:translateY(-1px)}button:active{transform:translateY(2px) scale(.97)!important;filter:brightness(.88);box-shadow:0 1px 0 #17456a!important}button:focus-visible,input:focus-visible{outline:2px solid #ffd37a;outline-offset:2px}#login,.panel{background:linear-gradient(145deg,#203650,#17283e);border:1px solid #476685;box-shadow:0 12px 32px #0005}#menuPanel{backdrop-filter:blur(12px);background:linear-gradient(145deg,#203a56f5,#13263df5);border-color:#6287a8}#menuTitle{font-size:17px}.productGrid,.stockGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.productCard,.stockCard{display:flex;flex-direction:column;gap:7px;min-width:0;padding:12px;border-radius:13px;background:linear-gradient(145deg,#294967,#1a3049);border:1px solid #54799a;box-shadow:inset 0 1px #ffffff12}.productIcon{font-size:30px}.productCard span{color:#ffdf8a;font-weight:800}.productCard small,.stockCard small{color:#b8cce0}.productCard button,.stockCard button{width:100%;font-size:12px;padding:8px}.secondary{background:linear-gradient(180deg,#526b84,#354c64);border:1px solid #8299ae}.shopIntro{padding:9px 11px;border-radius:9px;background:#25496a;color:#dceeff}.stockCard strong{font-size:22px;color:#91d5ff}.stockCard .ticker{font-size:11px;color:#a8c5dc}.refreshBtn{white-space:nowrap;padding:7px 10px;font-size:12px}#shopPrompt{display:none;position:absolute;z-index:5;left:50%;bottom:105px;transform:translateX(-50%);background:linear-gradient(180deg,#f3b84f,#ca7c24);color:#2b1b08;border:2px solid #ffe2a0;border-radius:24px;padding:12px 20px;box-shadow:0 5px 18px #0007;font-weight:900}#notice{max-width:min(92vw,620px);opacity:0;transition:opacity .18s,transform .18s;transform:translate(-50%,10px);pointer-events:none;border:1px solid #6d91b1;box-shadow:0 6px 20px #0007}#notice.show{opacity:1;transform:translate(-50%,0)}.tile{border-radius:10px;background:#29445f;padding:10px;border:1px solid #496987}#stockChart{border:1px solid #365570;box-shadow:inset 0 0 18px #0004}@media(max-width:600px){header{gap:6px}header h1{width:100%}.menus{order:3;width:100%}.menus button{flex:1 1 auto}.productGrid,.stockGrid{grid-template-columns:1fr 1fr}#menuPanel{top:110px;max-height:62vh}}
</style></head><body>
<header><h1>🧊 픽셀 경제 마을</h1><nav class="menus"><button onclick="openMenu('inventory')">🎒 가방</button><button onclick="openMenu('shop')">🛒 상점</button><button onclick="openMenu('bank')">🏦 은행</button><button onclick="openMenu('stocks')">📈 주식</button><button onclick="openMenu('land')">🏠 부동산</button><button onclick="openMenu('startup')">🏭 창업</button><button onclick="openMenu('settings')">⚙️ 설정</button></nav><button class="refreshBtn" onclick="syncGame()">↻ 새로고침</button><span id="connection">서버 연결 중</span></header>
<section id="login"><h2>🏘️ 교실 입장</h2><div class="row"><input id="name" maxlength="12" placeholder="이름 또는 별명"><input id="room" value="TOWN123" style="max-width:120px" placeholder="방 코드"><button onclick="join()">입장</button></div><p class="small">선생님이 알려준 방 코드를 입력하세요. 최대 30명.</p><p id="loginNotice" style="color:#ffdf82;min-height:20px"></p><hr><h3>👩‍🏫 교사용</h3><div class="row"><input id="pin" type="password" placeholder="교사 PIN"><button onclick="teacherLogin()">관리자 화면</button></div></section>
<section id="gameArea"><div id="hud"><b id="cash">현금 500원</b><br><span id="bank">예금 0원</span> · <span id="job">무직</span><br><span id="count">접속 0/30</span></div><div id="game"></div><button id="shopPrompt" onclick="openMenu('shop')">🏪 상점 이용하기</button><div id="lobbyOverlay"><h2 id="lobbyTitle">⏳ 수업 시작 대기 중</h2><p id="lobbyMessage">선생님이 시작 버튼을 누르면 마을 경제가 시작돼요.</p></div>
<div id="touchPad"><span class="empty"></span><button data-dir="forward">▲</button><span class="empty"></span><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div><button id="jump" onpointerdown="jumpStart()" onpointerup="jumpEnd()" onpointerleave="jumpEnd()">점프</button>
<div id="menuPanel" class="panel"><div class="row" style="justify-content:space-between"><h3 id="menuTitle">메뉴</h3><button onclick="closeMenu()">닫기 ✕</button></div><div id="menuContent"></div></div>
<div id="notice" style="position:absolute;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);background:#14243bdc;padding:6px 12px;border-radius:8px;text-align:center"></div>
<section id="teacher" class="panel"><div class="row" style="justify-content:space-between"><h2>👩‍🏫 선생님 관리자</h2><button onclick="document.getElementById('teacher').style.display='none'">닫기</button></div><p id="teacherCount"></p><div class="row"><button onclick="teacherCmd('start',1)">▶ 수업 시작</button><button onclick="teacherCmd('pause',1)">⏸ 일시정지</button><button onclick="teacherCmd('resume',1)">▶ 재개</button><button onclick="teacherCmd('end',1)">■ 수업 종료</button><button onclick="teacherCmd('reset',1)">대기 상태로</button><button onclick="teacherCmd('randomize',1)">🎲 자리 무작위 배치</button></div><div class="row"><input id="teacherNews" placeholder="경제 뉴스 입력"><button onclick="teacherCmd('news',document.getElementById('teacherNews').value)">뉴스 공지</button><input id="bonus" type="number" value="100" style="width:80px"><button onclick="teacherCmd('bonus',document.getElementById('bonus').value)">전체 보너스</button><input id="tax" type="number" value="5" style="width:65px"><button onclick="teacherCmd('tax',Number(document.getElementById('tax').value)/100)">세율 설정(%)</button></div><div id="roster"></div></section>
</section>
<script>
const socket=io();let myId=null,teacherPin='',teacher=false,players=[],scene,renderer,camera,world,me,remote=new Map(),keys={},jumping=false,vy=0,lastSend=0,lastX=0,lastZ=0,lastJump=false,menu='inventory',latestState=null,lastChartDraw=0;
const $=id=>document.getElementById(id);
function join(){socket.emit('join',{name:$('name').value,room:$('room').value})}
function teacherLogin(){teacherPin=$('pin').value;socket.emit('teacherLogin',teacherPin)}
function act(type,item='',amount=1){$('notice').textContent='⏳ 처리 중...';socket.emit('action',{type,item,amount})}
function syncGame(){if(!socket.connected){$('connection').textContent='재연결 중...';socket.connect();return}$('notice').textContent='↻ 게임 정보를 새로고침하는 중...';socket.emit('sync')}
function teacherCmd(type,value){socket.emit('teacherCommand',{pin:teacherPin,type,value})}
socket.on('connect',()=>$('connection').textContent='서버 연결됨');socket.on('disconnect',()=>$('connection').textContent='연결 끊김');
socket.on('joined',d=>{myId=d.id;$('login').style.display='none';$('gameArea').style.display='block';init3D()});
socket.on('teacherOK',s=>{teacher=true;$('login').style.display='none';$('gameArea').style.display='block';$('teacher').style.display='block';render(s)});
socket.on('notice',m=>{showNotice(m);$('loginNotice').textContent=m});socket.on('state',s=>{render(s);if($('notice').textContent.includes('새로고침'))showNotice('✅ 게임 정보가 최신 상태로 바뀌었어요.')});
function makeBlock(w,h,d,color,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;world.add(o);return o}
function makePlayer(id,name,color){const g=new THREE.Group();const mat=new THREE.MeshLambertMaterial({color});const skin=new THREE.MeshLambertMaterial({color:0xf0c59a});const body=new THREE.Mesh(new THREE.BoxGeometry(.72,.85,.38),mat);body.position.y=1.05;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.62,.62,.62),skin);head.position.y=1.82;g.add(head);const legs=[];for(let x of [-.2,.2]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.65,.28),new THREE.MeshLambertMaterial({color:0x26364e}));leg.position.set(x,.33,0);g.add(leg);legs.push(leg)}const cv=document.createElement('canvas');cv.width=256;cv.height=64;const ctx=cv.getContext('2d');ctx.fillStyle='#102030';ctx.fillRect(0,0,256,64);ctx.fillStyle='white';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(name.slice(0,12),128,44);const tex=new THREE.CanvasTexture(cv);const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));label.scale.set(2.4,.6,1);label.position.y=2.55;g.add(label);g.userData.legs=legs;g.userData.label=label;return g}
function init3D(){const host=$('game');scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9ed);scene.fog=new THREE.Fog(0x91c9ed,35,95);camera=new THREE.PerspectiveCamera(65,host.clientWidth/host.clientHeight,.1,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);world=new THREE.Group();scene.add(world);scene.add(new THREE.HemisphereLight(0xffffff,0x64805a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-15,30,15);sun.castShadow=true;scene.add(sun);
makeBlock(100,.5,100,0x68b96b,0,-.3,0);makeBlock(10,.08,100,0xaaa99a,0,.01,0);makeBlock(100,.08,10,0xaaa99a,0,.02,0);for(let i=-3;i<=3;i++)makeBlock(.5,.06,2.4,0xf4f0dc,i*1.25,.08,0);for(const x of [-8,8])for(const z of [-8,8]){makeBlock(.35,3,.35,0x34495e,x,1.5,z);makeBlock(1.1,.35,1.1,0xf2cf78,x,3.1,z);const glow=new THREE.PointLight(0xffd98a,.7,9);glow.position.set(x,3.3,z);scene.add(glow)}for(const z of [-5,5]){makeBlock(2.2,.25,.65,0x8a5a35,-7,.55,z);makeBlock(2.2,.75,.18,0x8a5a35,-7,.95,z-.22);makeBlock(2.2,.25,.65,0x8a5a35,7,.55,z);makeBlock(2.2,.75,.18,0x8a5a35,7,.95,z-.22)}
function building(x,z,w,d,h,wall,roof,label){makeBlock(w,h,d,wall,x,h/2,z);makeBlock(w+0.5,.45,d+0.5,roof,x,h+.2,z);makeBlock(.9,1.6,.15,0x65432c,x,0.8,z-d/2-.08);const signCanvas=document.createElement('canvas');signCanvas.width=512;signCanvas.height=128;const sx=signCanvas.getContext('2d');sx.fillStyle='#172a3d';sx.fillRect(0,0,512,128);sx.strokeStyle='#f4d58b';sx.lineWidth=9;sx.strokeRect(5,5,502,118);sx.fillStyle='#fff4d6';sx.font='bold 54px sans-serif';sx.textAlign='center';sx.textBaseline='middle';sx.fillText(label,256,65);const signTex=new THREE.CanvasTexture(signCanvas);const sign=new THREE.Sprite(new THREE.SpriteMaterial({map:signTex}));sign.position.set(x,h*.72,z-d/2-.2);sign.scale.set(Math.min(6,w*.8),1.5,1);world.add(sign)}
building(-13,-12,9,8,6,0xe6b65c,0x9d483d,'마을 상점');building(0,-16,10,9,8,0x8ab5d7,0x3e6592,'은행');building(14,-11,9,8,6,0xd28f8f,0x874b50,'시청');building(-14,13,10,8,5,0xa997d5,0x66528f,'주택 관리');building(13,13,10,8,7,0xd2c59d,0x5c8050,'회사 거리');
for(let i=-4;i<=4;i++){makeBlock(.3,.04,1.2,0x477f47,i*5,.02,6);makeBlock(1.2,.04,.3,0x477f47,6,.02,i*5)}
for(let i=0;i<22;i++){const x=(Math.random()-.5)*85,z=(Math.random()-.5)*85;if(Math.abs(x)<22&&Math.abs(z)<22)continue;makeBlock(.7,2,.7,0x79502f,x,1,z);const crown=new THREE.Mesh(new THREE.BoxGeometry(2.6,2.8,2.6),new THREE.MeshLambertMaterial({color:0x368b48}));crown.position.set(x,3.1,z);world.add(crown)}
me=makePlayer(myId,$('name').value||'나',0xf0c64b);scene.add(me);me.position.set(0,0,0);
window.addEventListener('resize',resize3D);requestAnimationFrame(loop)}
function resize3D(){if(!renderer)return;const h=$('game');camera.aspect=h.clientWidth/h.clientHeight;camera.updateProjectionMatrix();renderer.setSize(h.clientWidth,h.clientHeight)}
function render(s){if(!s)return;latestState=s;players=s.players||[];const status=s.gameStatus||'waiting';const overlay=$('lobbyOverlay');if(overlay){overlay.style.display=status==='running'?'none':'block';$('lobbyTitle').textContent=status==='paused'?'⏸ 수업 일시정지':status==='ended'?'■ 수업 종료':'⏳ 수업 시작 대기 중';$('lobbyMessage').textContent=status==='paused'?'선생님이 재개할 때까지 기다려 주세요.':status==='ended'?'오늘 수업이 종료됐어요.':'선생님이 시작 버튼을 누르면 마을 경제가 시작돼요.';}const p=players.find(v=>v.id===myId);if(p){if(me&&(Math.abs(me.position.x-p.x)>1.5||Math.abs(me.position.z-p.z)>1.5)){me.position.set(p.x,p.jump?.45:0,p.z);lastX=p.x;lastZ=p.z;}$('cash').textContent='현금 '+p.money+'원';$('bank').textContent='예금 '+p.bank+'원';$('job').textContent='직업: '+p.job;$('inventoryText')?.replaceChildren(document.createTextNode(''))} $('count').textContent='접속 '+players.length+'/30';if(teacher){$('teacherCount').textContent='현재 '+players.length+'/30명 접속 · 세율 '+Math.round(s.taxRate*100)+'% · 누적 세금 '+players.reduce((a,p)=>a+(p.taxPaid||0),0)+'원';$('roster').innerHTML='<h3>학생 현황</h3>'+players.map(p=>'<div class="tile">'+esc(p.name)+' · 현금 '+p.money+'원 · 예금 '+p.bank+'원 · 납부세금 '+(p.taxPaid||0)+'원 · '+esc(p.job)+'</div>').join('')}if(scene){const ids=new Set(players.filter(p=>p.id!==myId).map(p=>p.id));for(const [id,obj] of remote){if(!ids.has(id)){scene.remove(obj);remote.delete(id)}}players.filter(p=>p.id!==myId).forEach(p=>{let obj=remote.get(p.id);if(!obj){obj=makePlayer(p.id,p.name,0x5599ed);scene.add(obj);remote.set(p.id,obj)}obj.position.set(p.x||0,p.jump?.45:0,p.z||0)})}if(p)updateMenuData(p,s)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loop(t){requestAnimationFrame(loop);if(!scene)return;const shopNear=!!me&&Math.hypot(me.position.x+13,me.position.z+12)<=9&&latestState?.gameStatus==='running';if($('shopPrompt'))$('shopPrompt').style.display=shopNear?'block':'none';const canPlay=latestState?.gameStatus==='running';const forward=canPlay?((keys.forward?1:0)-(keys.back?1:0)):0,side=canPlay?((keys.right?1:0)-(keys.left?1:0)):0;let moving=forward!==0||side!==0;if(moving){const len=Math.hypot(forward,side);const f=forward/len,sd=side/len;me.position.x+=sd*.12;me.position.z-=f*.12;me.position.x=Math.max(-46,Math.min(46,me.position.x));me.position.z=Math.max(-46,Math.min(46,me.position.z));me.rotation.y=Math.atan2(sd,f)}if(jumping){vy-=.018;me.position.y+=vy;if(me.position.y<=0){me.position.y=0;vy=0;jumping=false}}if(moving){const phase=t*.014;me.userData.legs[0].rotation.x=Math.sin(phase)*.7;me.userData.legs[1].rotation.x=-Math.sin(phase)*.7}else{me.userData.legs.forEach(l=>l.rotation.x=0)}
const target=new THREE.Vector3(me.position.x,me.position.y+2,me.position.z);const behind=new THREE.Vector3(me.position.x,me.position.y+6,me.position.z+9);camera.position.lerp(behind,.12);camera.lookAt(target);
if(t-lastSend>100&&(Math.abs(me.position.x-lastX)>.04||Math.abs(me.position.z-lastZ)>.04||moving||jumping!==lastJump)){socket.emit('move3d',{x:me.position.x,z:me.position.z,jump:jumping});lastX=me.position.x;lastZ=me.position.z;lastJump=jumping;lastSend=t}
remote.forEach(obj=>{if(obj.userData.legs)obj.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*.01+i*Math.PI)*.12)});if(menu==='stocks'&&$('menuPanel').style.display==='block'&&t-lastChartDraw>180){drawStockChart();lastChartDraw=t}renderer.render(scene,camera)}
function jumpStart(){if(latestState?.gameStatus==='running'&&!jumping&&me){jumping=true;vy=.27;socket.emit('move3d',{x:me.position.x,z:me.position.z,jump:true})}}function jumpEnd(){}
function setKey(k,on){keys[k]=on}window.addEventListener('keydown',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.code==='Space'){jumpStart();e.preventDefault()}});window.addEventListener('keyup',e=>{const map={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};if(map[e.key])keys[map[e.key]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function openMenu(m){if(m==='shop'&&(!me||Math.hypot(me.position.x+13,me.position.z+12)>9)){showNotice('🏪 상점 건물까지 직접 걸어가야 해요. 지도에서 왼쪽 뒤편의 마을 상점을 찾아봐!');return}menu=m;$('menuPanel').style.display='block';drawMenu()}function closeMenu(){$('menuPanel').style.display='none'}
function showNotice(message){$('notice').textContent=message;$('notice').classList.add('show');clearTimeout(window.__noticeHide);window.__noticeHide=setTimeout(()=>$('notice').classList.remove('show'),4200)}
function drawMenu(){const titles={inventory:'🎒 내 가방',shop:'🛒 마을 상점',bank:'🏦 은행',stocks:'📈 주식 시장',land:'🏠 부동산',startup:'🏭 창업 센터',settings:'⚙️ 설정'};$('menuTitle').textContent=titles[menu];let c='';if(menu==='inventory')c='<p id="inventoryText">보유 물품은 접속 후 표시됩니다.</p>';if(menu==='shop'){const p=players.find(v=>v.id===myId);c='<p class="shopIntro">🏪 상점에 도착했어요! 물건을 골라 구매해 보세요.</p><div class="productGrid">'+[['apple','🍎','사과',10],['bread','🍞','빵',20],['toy','🧸','장난감',35]].map(([id,icon,name,price])=>'<article class="productCard"><div class="productIcon">'+icon+'</div><b>'+name+'</b><span>'+price+'원</span><small>보유 '+(p?.inventory[id]||0)+'개</small><button onclick="act(\'buy\',\''+id+'\',1)">1개 구매</button><button class="secondary" onclick="act(\'sell\',\''+id+'\',1)">1개 판매</button></article>').join('')+'</div><p class="small">구매·판매는 상점 근처에서만 가능해요. 구매하면 가방에 바로 추가됩니다.</p>'}if(menu==='bank')c='<p>100원 단위로 저축/출금할 수 있어요.</p><button onclick="act(\'deposit\',\'\',1)">100원 예금</button> <button onclick="act(\'withdraw\',\'\',1)">100원 출금</button>';if(menu==='stocks'){const list=latestState?.stocks||{},p=players.find(v=>v.id===myId);c='<p>실시간 주가 · 약 10초마다 변동</p><canvas id="stockChart" width="600" height="240"></canvas><div class="stockGrid">'+Object.entries(list).map(([t,v])=>'<article class="stockCard"><b>'+esc(v.name)+'</b><span class="ticker">'+t+'</span><strong>'+v.price+'원</strong><small>내 보유량: '+(p?.shares?.[t]||0)+'주</small><div class="row"><button onclick="act(\'stockBuy\',\''+t+'\',1)">＋ 매수</button><button class="secondary" onclick="act(\'stockSell\',\''+t+'\',1)">－ 매도</button></div></article>').join('')+'</div><p class="small">매수·매도 후 성공 여부와 잔액을 알림으로 알려줘요.</p>';setTimeout(drawStockChart,0)}if(menu==='land')c='<p>작은 집 500원 · 상점 건물 900원 · 강변 집 1,200원</p><button onclick="act(\'property\',\'house1\')">작은 집 구매</button> <button onclick="act(\'property\',\'shop1\')">상점 구매</button> <button onclick="act(\'property\',\'house2\')">강변 집 구매</button>';if(menu==='startup'){const own=players.find(p=>p.id===myId)?.company;c='<p>창업 비용 300원 · 창업하면 회사 주식 10주를 받아요.</p><input id="companyName" maxlength="12" placeholder="회사 이름 입력"><button onclick="act(\'startup\',document.getElementById(\'companyName\').value,1)">회사 창업하기</button><h4>우리 마을 회사</h4>'+(latestState?.companies||[]).map(c=>'<p>'+esc(c.name)+' · '+c.ticker+' · 대표 '+esc(c.owner)+' · 주가 '+c.price+'원</p>').join('')+(own?'<p>내 회사: '+esc(own)+'</p>':'')};if(menu==='settings')c='<p>조작: WASD 또는 방향키로 이동, 스페이스/점프 버튼으로 점프.</p><p>태블릿은 화면 왼쪽 방향키를 사용하세요.</p><button onclick="closeMenu()">게임으로 돌아가기</button>'; $('menuContent').innerHTML=c}
function drawStockChart(){const canvas=$('stockChart');if(!canvas||!latestState)return;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const histories=latestState.stockHistory||{},entries=Object.entries(histories).filter(([,v])=>v&&v.length);if(!entries.length)return;const all=entries.flatMap(([,v])=>v),min=Math.max(0,Math.min(...all)-8),max=Math.max(...all)+8,range=Math.max(12,max-min),left=48,right=w-16,top=30,bottom=h-28;ctx.font='13px sans-serif';ctx.textAlign='right';ctx.fillStyle='#9eb4ca';for(let i=0;i<=4;i++){const y=top+(bottom-top)*i/4,val=Math.round(max-(max-min)*i/4);ctx.strokeStyle='#344b64';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();ctx.fillText(val+'원',left-7,y+4)}const colors=['#62c7ff','#ffbd69','#9be28b','#d6a0ff','#ff8c9d'];entries.forEach(([ticker,values],idx)=>{const color=colors[idx%colors.length],pts=values.map((v,i)=>({x:left+(right-left)*i/Math.max(1,values.length-1),y:bottom-(v-min)/range*(bottom-top)}));if(!pts.length)return;ctx.beginPath();pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else{const prev=pts[i-1],mx=(prev.x+p.x)/2;ctx.quadraticCurveTo(prev.x,prev.y,mx,(prev.y+p.y)/2);if(i===pts.length-1)ctx.lineTo(p.x,p.y)}});ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=7;ctx.stroke();ctx.shadowBlur=0;const fill=ctx.createLinearGradient(0,top,0,bottom);fill.addColorStop(0,color+'55');fill.addColorStop(1,color+'00');ctx.lineTo(pts[pts.length-1].x,bottom);ctx.lineTo(pts[0].x,bottom);ctx.closePath();ctx.fillStyle=fill;ctx.fill();const point=pts[pts.length-1];ctx.beginPath();ctx.arc(point.x,point.y,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();const stock=latestState.stocks[ticker];ctx.fillStyle=color;ctx.textAlign='left';ctx.font='bold 14px sans-serif';ctx.fillText(ticker+' '+(stock?.price??values[values.length-1])+'원',left+idx*150,17)})}
function updateMenuData(p,s){if(menu==='stocks'&&$('menuPanel').style.display==='block')drawStockChart();if(menu==='startup'&&$('menuPanel').style.display==='block')drawMenu();if(menu==='inventory'&&$('menuPanel').style.display==='block'){$('menuContent').innerHTML='<p>사과 '+p.inventory.apple+'개 · 빵 '+p.inventory.bread+'개 · 장난감 '+p.inventory.toy+'개</p><p>하늘항공 '+p.shares.SKY+'주 · 픽셀상사 '+p.shares.PIX+'주</p><p>보유 부동산: '+(p.property.length?p.property.join(', '):'없음')+'</p>'}}
</script></body></html>
