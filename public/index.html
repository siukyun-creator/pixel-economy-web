<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>픽셀 경제 마을</title><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4ff;font-family:system-ui,sans-serif}header{padding:12px;background:#1b2b43;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:19px;margin:0}.panel{background:#1b2b43;border-radius:12px;padding:10px;margin:8px}button,input{font-size:16px;padding:10px;border:0;border-radius:9px;max-width:100%}button{background:#4e9bdf;color:white;font-weight:700}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.small{font-size:13px;color:#b9c8dc}#login{max-width:550px;margin:30px auto}#gameArea,#teacher{display:none}#game{max-width:900px;margin:auto}#game canvas{width:100%!important;height:auto!important;display:block;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center;margin:8px}.controls button{height:52px;font-size:23px}.blank{visibility:hidden}#notice{min-height:22px;color:#ffdf82}.tile{padding:8px;background:#263c58;border-radius:8px;margin:5px 0}
</style></head><body><header><h1>🏘️ 픽셀 경제 마을</h1><span id="connection">서버 연결 중</span></header>
<section id="login" class="panel"><h2>교실 입장</h2><div class="row"><input id="name" maxlength="12" placeholder="이름 또는 별명"><input id="room" value="TOWN123" style="width:120px" placeholder="방 코드"><button onclick="join()">입장</button></div><p class="small">선생님이 알려준 방 코드를 입력하세요. 최대 30명.</p><hr><h3>교사용</h3><div class="row"><input id="pin" type="password" placeholder="교사 PIN"><button onclick="teacherLogin()">관리자 화면</button></div></section>
<section id="gameArea"><div class="panel row"><b id="cash">현금 500원</b><span id="bank">예금 0원</span><span id="job">직업: 무직</span><span id="count">접속 0/30</span></div><div id="game"></div><div class="controls"><span class="blank"></span><button onpointerdown="move(0,-1)">▲</button><span class="blank"></span><button onpointerdown="move(-1,0)">◀</button><button onpointerdown="move(0,1)">▼</button><button onpointerdown="move(1,0)">▶</button></div>
<div class="panel"><b>경제 활동</b><div class="row"><button onclick="act('work')">일하기 +100원</button><button onclick="act('buy','apple',1)">사과 구매 10원</button><button onclick="act('buy','bread',1)">빵 구매 20원</button><button onclick="act('sell','apple',1)">사과 판매</button><button onclick="act('deposit','',1)">예금 100원</button><button onclick="act('withdraw','',1)">출금 100원</button><button onclick="act('stockBuy','SKY',1)">하늘항공 주식 50원</button><button onclick="act('stockSell','SKY',1)">주식 판매</button><button onclick="act('property','house1')">작은 집 구매</button></div><p id="notice"></p><p id="news" class="small">경제 뉴스</p></div>
<div class="panel"><b>친구에게 송금</b><div class="row"><input id="target" placeholder="친구 별명"><input id="amount" type="number" value="50" min="1" max="500" style="width:90px"><button onclick="act('transfer',document.getElementById('target').value,document.getElementById('amount').value)">송금</button></div><div id="inventory" class="small"></div></div></section>
<section id="teacher" class="panel"><h2>👩‍🏫 선생님 관리자 화면</h2><p id="teacherCount"></p><div class="row"><input id="teacherNews" placeholder="경제 뉴스 입력"><button onclick="teacherCmd('news',document.getElementById('teacherNews').value)">뉴스 공지</button><input id="bonus" type="number" value="100" style="width:90px"><button onclick="teacherCmd('bonus',document.getElementById('bonus').value)">전체 보너스</button><input id="tax" type="number" value="5" style="width:70px"><button onclick="teacherCmd('tax',Number(document.getElementById('tax').value)/100)">세율 설정(%)</button></div><div id="roster"></div></section>
<script>
const socket=io();let myId=null,teacherPin='',teacher=false,sceneObj=null;
function join(){socket.emit('join',{name:document.getElementById('name').value,room:document.getElementById('room').value})}function teacherLogin(){teacherPin=document.getElementById('pin').value;socket.emit('teacherLogin',teacherPin)}function move(dx,dy){socket.emit('move',{dx,dy})}function act(type,item='',amount=1){socket.emit('action',{type,item,amount})}function teacherCmd(type,value){socket.emit('teacherCommand',{pin:teacherPin,type,value})}
socket.on('connect',()=>document.getElementById('connection').textContent='서버 연결됨');socket.on('disconnect',()=>document.getElementById('connection').textContent='연결 끊김');socket.on('joined',d=>{myId=d.id;document.getElementById('login').style.display='none';document.getElementById('gameArea').style.display='block'});socket.on('teacherOK',s=>{teacher=true;document.getElementById('teacher').style.display='block';render(s)});socket.on('notice',m=>document.getElementById('notice').textContent=m);socket.on('state',render);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(s){if(!s)return;const me=s.players.find(p=>p.id===myId);if(me){cash.textContent='현금 '+me.money+'원';bank.textContent='예금 '+me.bank+'원';job.textContent='직업: '+me.job;inventory.textContent=`보유 물품: 사과 ${me.inventory.apple}개 · 빵 ${me.inventory.bread}개 · 장난감 ${me.inventory.toy}개 · 하늘항공 주식 ${me.shares.SKY}주 · 픽셀상사 주식 ${me.shares.PIX}주`;}count.textContent=`접속 ${s.players.length}/30`;news.textContent='경제 뉴스: '+s.news;if(teacher){teacherCount.textContent=`현재 ${s.players.length}/30명 접속 · 세율 ${Math.round(s.taxRate*100)}%`;roster.innerHTML='<h3>학생 현황</h3>'+s.players.map(p=>`<div class="tile">${esc(p.name)} · 현금 ${p.money}원 · 예금 ${p.bank}원 · ${esc(p.job)}</div>`).join('');}if(sceneObj)sceneObj.drawPlayers(s.players,myId)}
const config={type:Phaser.AUTO,parent:'game',width:800,height:500,backgroundColor:'#8dcf9a',scene:{create(){sceneObj=this;const g=this.add.graphics();g.fillStyle(0x78c98b);g.fillRect(0,0,800,500);for(let y=70;y<500;y+=65)for(let x=35;x<800;x+=90){g.fillStyle(0x69b97d);g.fillEllipse(x,y,68,30)}const b=[['도매상',125,160,0xc68b54],['상점',320,115,0xe5b85c],['은행',535,165,0x7ba6d8],['시청',675,330,0xd18b8b],['부동산',300,350,0x9b8bd1]];b.forEach(([n,x,y,c])=>{g.fillStyle(c);g.fillRect(x-38,y-25,76,50);g.fillStyle(0x65452f);g.fillTriangle(x-46,y-25,x,y-60,x+46,y-25);this.add.text(x,y+32,n,{fontSize:'15px',color:'#173323',backgroundColor:'#ffffffcc',padding:{x:4,y:2}}).setOrigin(.5)});this.dots=this.add.graphics()},drawPlayers(ps,id){this.dots.clear();ps.forEach(p=>{this.dots.fillStyle(p.id===id?0xffe45c:0x315baf);this.dots.fillCircle(p.x,p.y,9);this.add.text(p.x,p.y-20,p.name,{fontSize:'12px',color:'#10251a',backgroundColor:'#ffffffcc',padding:{x:2,y:1}}).setOrigin(.5)})}}};new Phaser.Game(config);
</script></body></html>
